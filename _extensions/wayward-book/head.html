<script>
  (function () {
    document.documentElement.dataset.theme = 'light';
    document.documentElement.dataset.brand = 'wayward-book';
    try {
      localStorage.removeItem('theme');
    } catch (err) {
      void err;
    }
  })();
</script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var body = document.body;
    var sidebar = document.getElementById('quarto-sidebar');
    if (!sidebar) return;

    body.classList.add('wayward-book-shell');

    if (!document.querySelector('.wayward-book-header')) {
      var header = document.createElement('header');
      header.className = 'wayward-book-header';
      header.innerHTML = [
        '<div class="wayward-book-header__inner">',
        '  <a class="wayward-book-brand" href="/" aria-label="Wayward House home">',
        '    <span class="wayward-book-brand__mark">WaywardHouse</span>',
        '    <span class="wayward-book-brand__dot" aria-hidden="true">.</span>',
        '  </a>',
        '  <nav class="wayward-book-nav" aria-label="Primary">',
        '    <a href="/articles/" data-nav="/articles/">Articles</a>',
        '    <a href="/learn/" data-nav="/learn/">Learn</a>',
        '    <a href="/about.html" data-nav="/about/">About</a>',
        '  </nav>',
        '  <button class="wayward-book-menu-toggle" type="button" data-bs-toggle="collapse" data-bs-target=".quarto-sidebar-collapse-item" aria-controls="quarto-sidebar" aria-expanded="false" aria-label="Toggle chapter navigation">',
        '    <span aria-hidden="true">Menu</span>',
        '  </button>',
        '</div>'
      ].join('');
      body.prepend(header);
    }

    var pathname = window.location.pathname || '/';
    if (pathname === '/' || pathname === '/learn/' || pathname.endsWith('/index.html')) {
      body.classList.add('page-home');
    }
    if (pathname.indexOf('/learn/') === 0) {
      body.classList.add('page-learn');
    }

    var storageKey = 'wayward-data-engineering-sidebar';
    var media = window.matchMedia('(min-width: 1200px)');
    var glass = document.getElementById('quarto-sidebar-glass');
    var toggles = Array.from(document.querySelectorAll('[data-bs-target=".quarto-sidebar-collapse-item"]'));

    function setDesktopState(open) {
      body.classList.toggle('book-sidebar-collapsed', !open);
      body.classList.toggle('book-sidebar-open', open);
      try {
        localStorage.setItem(storageKey, open ? 'open' : 'collapsed');
      } catch (err) {
        void err;
      }
    }

    function applyDesktopDefault() {
      if (!media.matches) {
        body.classList.remove('book-sidebar-collapsed', 'book-sidebar-open');
        return;
      }

      var stored = null;
      try {
        stored = localStorage.getItem(storageKey);
      } catch (err) {
        void err;
      }

      setDesktopState(stored === 'collapsed' ? false : true);
    }

    toggles.forEach(function (toggle) {
      toggle.addEventListener('click', function (event) {
        if (!media.matches) return;
        event.preventDefault();
        event.stopPropagation();
        setDesktopState(body.classList.contains('book-sidebar-collapsed'));
      });
    });

    if (glass) {
      glass.addEventListener('click', function (event) {
        if (!media.matches) return;
        event.preventDefault();
        setDesktopState(false);
      });
    }

    if (media.addEventListener) {
      media.addEventListener('change', applyDesktopDefault);
    } else if (media.addListener) {
      media.addListener(applyDesktopDefault);
    }

    applyDesktopDefault();

    var siteHomeHref = '/';
    var learnHref = '/learn/';
    var titleLink = sidebar.querySelector('.sidebar-title a');
    if (titleLink) titleLink.setAttribute('href', siteHomeHref);

    var toolLinks = Array.from(sidebar.querySelectorAll('.quarto-navigation-tool'));
    if (toolLinks[0]) toolLinks[0].setAttribute('href', siteHomeHref);
    if (toolLinks[1]) toolLinks[1].setAttribute('href', learnHref);

    var firstSidebarLink = sidebar.querySelector('.sidebar-item a.sidebar-link');
    if (firstSidebarLink) firstSidebarLink.setAttribute('href', siteHomeHref);

    var themeToggle = document.querySelector('.wayward-book-theme-toggle');
    if (themeToggle) themeToggle.remove();

    document.querySelectorAll('.wayward-book-nav a[data-nav]').forEach(function (link) {
      var target = link.getAttribute('data-nav');
      if (!target) return;
      link.classList.remove('is-active');
      if (pathname === target || pathname.indexOf(target) === 0) {
        link.classList.add('is-active');
      }
    });

    var footer = document.querySelector('footer.footer');
    if (footer && !footer.classList.contains('wayward-book-footer')) {
      footer.className = 'wayward-book-footer';
      footer.innerHTML = [
        '<div class="wayward-book-footer__inner">',
        '  <div class="wayward-book-footer__brand">',
        '    <div class="wayward-book-footer__logo">WaywardHouse<span>.</span></div>',
        '    <p>Understanding how place, economy, and environment interact through analysis, modelling, and open tools.</p>',
        '  </div>',
        '  <nav class="wayward-book-footer__group" aria-labelledby="book-footer-reading">',
        '    <h2 id="book-footer-reading">Reading</h2>',
        '    <a href="https://wayward.house/articles/">Articles</a>',
        '    <a href="https://wayward.house/learn/">Library</a>',
        '    <a href="https://wayward.house/archive.html">Archive</a>',
        '  </nav>',
        '  <nav class="wayward-book-footer__group" aria-labelledby="book-footer-site">',
        '    <h2 id="book-footer-site">Site</h2>',
        '    <a href="https://wayward.house/start-here.html">Choose Your Path</a>',
        '    <a href="https://wayward.house/about.html">About</a>',
        '    <a href="https://wayward.house/contact.html">Contact</a>',
        '  </nav>',
        '  <nav class="wayward-book-footer__group" aria-labelledby="book-footer-resources">',
        '    <h2 id="book-footer-resources">Resources</h2>',
        '    <a href="https://wayward.house/topics/">All Topics</a>',
        '    <a href="https://wayward.house/privacy.html">Privacy Policy</a>',
        '    <a href="https://wayward.house/terms.html">Terms of Use</a>',
        '  </nav>',
        '</div>'
      ].join('');
    }

    if (!document.querySelector('.back-to-top')) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'back-to-top';
      button.setAttribute('aria-label', 'Back to top');
      button.innerHTML = '<span aria-hidden="true">↑</span><span>Top</span>';

      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var ticking = false;

      function updateBackToTop() {
        var scrolled = window.scrollY || document.documentElement.scrollTop || 0;
        var longPage = document.documentElement.scrollHeight > window.innerHeight * 1.5;
        button.classList.toggle('is-visible', longPage && scrolled > Math.max(420, window.innerHeight * 0.7));
        ticking = false;
      }

      button.addEventListener('click', function () {
        window.scrollTo({
          top: 0,
          behavior: prefersReduced ? 'auto' : 'smooth'
        });
      });

      window.addEventListener('scroll', function () {
        if (!ticking) {
          window.requestAnimationFrame(updateBackToTop);
          ticking = true;
        }
      }, { passive: true });

      window.addEventListener('resize', updateBackToTop, { passive: true });
      body.appendChild(button);
      updateBackToTop();
    }

  });
</script>
